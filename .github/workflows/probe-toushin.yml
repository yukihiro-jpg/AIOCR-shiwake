name: probe-toushin (一時診断)

on:
  push:
    paths:
      - '.github/workflows/probe-toushin.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 正式名称が入っているHTMLの前後行を出力
        run: |
          set +e
          curl -sS -o /tmp/p.html -A "Mozilla/5.0" \
            "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000?isinCd=JP90C00021T2&associFundCd=02313043"
          echo "===== 正式名称の行番号 ====="
          grep -n "ラサール・グローバルＲＥＩＴファンド" /tmp/p.html | head -3
          echo "===== 前後8行 ====="
          grep -n -B 8 -A 4 "ラサール・グローバルＲＥＩＴファンド" /tmp/p.html | head -40
          echo "===== 略称(title)の行の前後 ====="
          grep -n -B 3 -A 3 "<title>" /tmp/p.html | head -12
