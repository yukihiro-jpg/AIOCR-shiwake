name: probe-toushin (一時診断)

# 投資信託協会（投信総合検索ライブラリー）でファンド名が取得できるURLを特定するための一時ワークフロー。
# 確認後は削除する。
on:
  push:
    paths:
      - '.github/workflows/probe-toushin.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ファンド名が載っているURLを総当たりで探す（既知の正常データで検証）
        run: |
          set +e
          ISIN=JP90C00021T2; ASSOC=02313043; KEY=ラサール
          CANDS="
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/detail?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/fundDetail?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/setDisclosureInput?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/standardPrice?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/view/FDST030000?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/fund-information?isinCd=${ISIN}&associFundCd=${ASSOC}
          https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/fund-basic-information?isinCd=${ISIN}&associFundCd=${ASSOC}
          "
          for U in $CANDS; do
            [ -z "$U" ] && continue
            CODE=$(curl -sS -o /tmp/p.bin -w '%{http_code}' -A "Mozilla/5.0" "$U")
            SIZE=$(wc -c < /tmp/p.bin)
            iconv -f CP932 -t UTF-8 /tmp/p.bin 2>/dev/null > /tmp/p.u8 || cp /tmp/p.bin /tmp/p.u8
            HIT=$(grep -c "$KEY" /tmp/p.u8)
            T=$(grep -o -i "<title>[^<]*</title>" /tmp/p.u8 | head -1)
            echo "[$CODE] size=$SIZE hit=$HIT  $T"
            echo "    URL=$U"
            if [ "$HIT" -gt 0 ]; then
              echo "    ★ヒット箇所:"; grep -o ".\{0,50\}${KEY}.\{0,90\}" /tmp/p.u8 | head -3
            fi
          done

      - name: 一覧・検索系のエンドポイントを確認
        run: |
          set +e
          ISIN=JP90C00021T2; KEY=ラサール
          for U in \
            "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST020000/fundSearch?isinCd=${ISIN}" \
            "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST020000/search?isinCd=${ISIN}" \
            "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST020000/csv-file-download" \
            "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST010000" ; do
            CODE=$(curl -sS -o /tmp/q.bin -w '%{http_code}' -A "Mozilla/5.0" "$U")
            SIZE=$(wc -c < /tmp/q.bin)
            iconv -f CP932 -t UTF-8 /tmp/q.bin 2>/dev/null > /tmp/q.u8 || cp /tmp/q.bin /tmp/q.u8
            echo "[$CODE] size=$SIZE hit=$(grep -c "$KEY" /tmp/q.u8)  $U"
          done

      - name: 問題のISIN/協会コードの組み合わせを検証
        run: |
          set +e
          echo "--- ユーザー報告の JP90C00033G2 / 3231108C ---"
          curl -sS -o /tmp/a.bin -w 'CSV http=%{http_code}\n' -A "Mozilla/5.0" \
            "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/csv-file-download?isinCd=JP90C00033G2&associFundCd=3231108C"
          head -c 200 /tmp/a.bin; echo
          echo "--- 協会コードの末尾英字を大文字/小文字で試す ---"
          for A in 3231108C 3231108c 03231108 32311080; do
            CODE=$(curl -sS -o /tmp/b.bin -w '%{http_code}' -A "Mozilla/5.0" \
              "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/csv-file-download?isinCd=JP90C00033G2&associFundCd=${A}")
            echo "assoc=${A} http=${CODE} size=$(wc -c < /tmp/b.bin) head=$(head -c 60 /tmp/b.bin | iconv -f CP932 -t UTF-8 2>/dev/null | tr -d '\n')"
          done
